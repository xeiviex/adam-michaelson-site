<!DOCTYPE html>
<html lang="en" data-no-scroll-hint>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LendingTree lifecycle | Adam Michaelson</title>
<meta name="description" content="A clickable prototype of the full customer lifecycle on LendingTree's own website and app, from first question to renewal.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lendingtree/visiontypes/lifecycle/lifecycle.css?v=3">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script>(function(){var q=new URLSearchParams(location.search);if(q.get('embed')==='1')document.documentElement.classList.add('embed');})();</script>
</head>
<body>

<!-- Prototype chrome: outside the product. -->
<div class="pstrip" id="pstrip">
  <a class="pback exitbar" href="/lendingtree/getting-started/#visiontypes"><span aria-hidden="true">&lsaquo;</span> <span id="pbackT">Back to the slides</span></a>
</div>
<div class="dev" id="dev">
  <div class="dev-menu" id="devMenu" hidden>
    <p id="devNote"></p>
    <div class="dev-seg" id="devPath" role="group" aria-label="Path"></div>
    <div class="dev-lbl2">Jump to</div>
    <div class="dev-jumps" id="devJumps"></div>
    <button type="button" id="doReset"></button>
    <p class="dev-fine" id="devFine"></p>
  </div>
  <div class="dev-combo">
    <button type="button" class="dev-main" id="devToggle" aria-pressed="true" aria-label="Auto-play is on. Pause"><span class="dev-lbl">Auto-play</span><span class="dev-ic" id="devIc"></span></button>
    <button type="button" class="dev-caret" id="devBtn" aria-expanded="false" aria-controls="devMenu" aria-haspopup="true" aria-label="Prototype controls"><span class="dev-word">Prototype</span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<!-- The product: LendingTree's website on wide screens, the LendingTree app on phones. -->
<div class="lt" id="lt">
  <header class="hd">
    <button type="button" class="logo" id="logo" aria-label="LendingTree, go to your guide">
      <img class="logo-full" src="/lendingtree/img/lt-logo.png" alt="LendingTree" width="114" height="36">
      <img class="logo-leaf" src="/lendingtree/img/lt-leaf.png" alt="" width="26" height="26">
    </button>
    <div class="hd-title" id="hdTitle" aria-hidden="true"></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="me" aria-label="Signed in as Alex Rivera"><span class="me-n">Alex</span><span class="av" aria-hidden="true">AR</span></div>
  </header>
  <div class="life" id="life" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1">
    <section class="view" id="v-guide" aria-label="Guide"><div class="stream" id="stream" aria-live="polite"></div></section>
    <section class="view" id="v-loans" aria-label="Loans" hidden></section>
    <section class="view" id="v-insurance" aria-label="Insurance" hidden></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="App sections"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<!-- More prototype chrome: the interstitial and the time-skip caption. -->
<div class="skip" id="skip" role="status" hidden></div>
<div class="pmodal" id="pmodal" role="dialog" aria-modal="true" aria-labelledby="pmTitle" hidden>
  <div class="pm-card">
    <span class="pm-kick">Prototype</span>
    <h2 id="pmTitle"></h2>
    <p id="pmBody"></p>
    <div class="pm-btns" id="pmBtns"></div>
    <p class="pm-count" id="pmCount" role="timer" hidden></p>
  </div>
</div>

<script type="module" src="/lendingtree/visiontypes/lifecycle/app.js?v=3"></script>
</body>
</html>
