<style>
  :root {
    --bg: #000000;
    --ink: #f4f2ea;       /* soft white for the quote */
    --muted: #b7b4a8;     /* dimmer white for the attribution */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 7vh 8vw max(14vh, 7rem);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #stage {
    max-width: min(880px, 88vw);
    opacity: 1;
  }
  /* Only the fade-OUT is slow; the fade back in for a new quote is instant. */
  #stage.fade { transition: opacity 2.6s ease; }

  #quote {
    position: relative;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.5rem, 3.5vw, 2.6rem);
    line-height: 1.3;
    letter-spacing: 0.005em;
  }
  /* .ghost reserves the full final footprint (invisible) so nothing that is
     already typed reflows, re-wraps, or shifts as more letters appear. The
     visible ".typed" layer is overlaid exactly on top of it. */
  #quote .ghost { visibility: hidden; }
  #quote .typed { position: absolute; top: 0; left: 0; width: 100%; }

  #caret {
    display: none;
    width: 0.06em;
    height: 1.02em;
    background: currentColor;
    margin-left: 0.04em;
    vertical-align: -0.12em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #author {
    margin-top: 1.5rem;
    text-align: right;
    font-style: normal;
    font-weight: 400;
    color: var(--muted);
    font-size: clamp(1rem, 1.6vw, 1.35rem);
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.9s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    #caret { display: none !important; }
  }

  /* Identity and contact, kept deliberately quiet so the quote still carries
     the page. It is also what tells a carrier compliance reviewer who runs
     this site and how to reach him (Twilio error 30489). */
  #colophon {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 1.4rem 8vw 1.6rem;
    text-align: center;
    font-size: clamp(0.72rem, 1.05vw, 0.84rem);
    line-height: 1.7;
    letter-spacing: 0.03em;
    color: var(--muted);
    opacity: 0.42;
    transition: opacity 0.4s ease;
  }
  #colophon:hover, #colophon:focus-within { opacity: 0.9; }
  #colophon a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
  #colophon a:hover, #colophon a:focus-visible { color: var(--ink); }
  #colophon .who { display: block; }
  #colophon .sep { padding: 0 0.45em; opacity: 0.6; }
  @media (max-width: 30rem) {
    #colophon { padding-bottom: 1.1rem; letter-spacing: 0.02em; }
    #colophon .sep { padding: 0 0.3em; }
  }
</style>
</head>
<body>

  const stage  = document.getElementById('stage');
  const ghost  = document.getElementById('ghost');
  const qtext  = document.getElementById('qtext');
  const caret  = document.getElementById('caret');
  const author = document.getElementById('author');

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = -1;

  function pick() {
    let i;
    do { i = Math.floor(Math.random() * quotes.length); }
    while (i === last && quotes.length > 1);
    last = i;
    return quotes[i];
  }

  // Slightly longer pauses after punctuation give a natural typewriter cadence.
  function delayFor(ch) {
    if ('.!?…'.indexOf(ch) !== -1) return 300;
    if (',;:—'.indexOf(ch) !== -1) return 150;
    return TYPE_SPEED;
  }

  function typeQuote(text, done) {
    qtext.textContent = '';
    if (reduce) { qtext.textContent = text; done(); return; }
    caret.style.display = 'inline-block';
    let i = 0;
    (function step() {
      if (i < text.length) {
        const ch = text[i++];
        qtext.textContent += ch;
        setTimeout(step, delayFor(ch));
      } else {
        caret.style.display = 'none';
        done();
      }
    })();
  }

  function cycle() {
    const item = pick();
    // Reset instantly on black, then reveal.
    stage.classList.remove('fade');
    stage.style.opacity = '1';

    // Reserve the full footprint up front: the invisible ghost holds the
    // quote's final size/wrapping, and the author line is placed (invisible)
    // so its space is held too. Nothing shifts once typing begins.
    ghost.textContent = item.q;
    qtext.textContent = '';

    author.style.transition = 'none';
    author.style.opacity = '0';
    author.textContent = '— ' + item.a;   // em dash + space

    typeQuote(item.q, function () {
      author.style.transition = 'opacity 0.9s ease';
      requestAnimationFrame(function () { author.style.opacity = '1'; });

      setTimeout(function () {
        stage.classList.add('fade');
        stage.style.opacity = '0';
        setTimeout(cycle, FADE_MS + GAP_MS);
      }, HOLD_MS);
    });
  }

  setTimeout(cycle, START_MS);
</script>
