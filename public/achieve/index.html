<!DOCTYPE html>
<html lang="en" data-no-scroll-hint>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Achieve | Get out of debt (prototype)</title>
<meta name="description" content="A prototype of a guided debt relief journey, from first question to debt free. Sample data only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/achieve/firsttake/achieve.css?v=1">
<link rel="stylesheet" href="/achieve/path.css?v=1">
<link rel="icon" href="/achieve/firsttake/img/logo-mark.png" type="image/png">
</head>
<body class="ach">
<header class="top">
  <a class="brand" href="/achieve/" aria-label="Achieve home"><img src="/achieve/firsttake/img/logo-full.png" alt="achieve" width="124" height="32"></a>
  <div class="top-r">
    <span class="mins" aria-live="polite"></span>
    <a class="tel" href="tel:+18334352021"><span class="ico" id="telIc"></span><span class="tel-t">(833) 435-2021</span></a>
  </div>
  <div class="bar" role="progressbar" aria-label="Your path"><i id="barFill"></i></div>
</header>

<button class="strip" id="strip" type="button" aria-label="Show your path">
  <span><b id="stripStep"></b><span class="sep"> &middot; </span><span class="mins"></span></span>
  <span class="ico" id="stripIc"></span>
</button>

<div class="shell">
  <main class="col" aria-label="Your journey">
    <div class="stream" id="stream" tabindex="0" aria-live="polite">
      <div class="tail" id="tail"></div>
    </div>
    <div class="dock" id="dock">
      <div class="dock-in">
        <div class="sugg-row" id="suggRow"></div>
        <div class="dock-row">
          <form class="ask" id="askForm" autocomplete="off">
            <input id="askInput" type="text" maxlength="500" placeholder="Ask a question..." aria-label="Ask a question">
            <button type="submit" aria-label="Send" id="sendBtn"></button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <aside class="road" id="road" aria-label="Your path to freedom">
    <div class="road-head">
      <button class="road-x" id="roadClose" type="button" aria-label="Close"><span class="ico" id="xIc"></span></button>
      <div class="road-t">Your path to freedom</div>
      <div class="road-pct"><b id="pct">0%</b> <span>of the way</span></div>
      <div class="rbar"><i id="roadFill"></i></div>
      <div class="mins"></div>
    </div>
    <nav id="roadInner" aria-label="Stages"></nav>
  </aside>
</div>
<div class="road-back" id="roadBack"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="dev" id="dev">
  <div class="dev-menu" id="devMenu" hidden>
    <p>Prototype controls. Not part of the product.</p>
    <button type="button" id="doAuto">Auto-play: on</button>
    <button type="button" id="doSpeed">Speed: Fast</button>
    <button type="button" id="doSkip">Skip to the end of this stage</button>
    <button type="button" id="doReset">Start over</button>
  </div>
  <button type="button" class="dev-btn" id="devBtn" aria-expanded="false" aria-controls="devMenu">Auto-play on</button>
</div>

<script type="module">
  import { icon } from '/achieve/firsttake/shared/dom.js';
  const put = (id, name, size, sw) => { const e = document.getElementById(id); if (e) e.innerHTML = icon(name, size, sw); };
  put('telIc', 'phone', 18); put('stripIc', 'menu', 20, 2); put('xIc', 'x', 20); put('sendBtn', 'send', 18, 2);
</script>
<script type="module" src="/achieve/app.js?v=1"></script>
</body>
</html>
