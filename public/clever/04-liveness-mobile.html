<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liveness — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #1D4FD8;
    --inkwell: #10151F;
    --mist: #C9CFE0;
    --poppy: #E23F32;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', sans-serif;
    background: #E7EAEE;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 0;
  }

  .device {
    width: 393px; height: 852px; background: #000; border-radius: 55px; padding: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35); position: relative;
  }
  .screen {
    width: 100%; height: 100%; background: var(--inkwell); border-radius: 42px;
    overflow: hidden; position: relative; display: flex; flex-direction: column; color: white;
  }
  .notch {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #000; border-radius: 20px; z-index: 100;
  }

  .partner-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 52px 18px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
  }
  .host-context { display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.55); }
  .host-context .host-dot {
    width: 18px; height: 18px; border-radius: 5px; background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700;
  }
  .docusign-badge { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,0.75); }
  .docusign-badge .ds-mark {
    width: 18px; height: 18px; border-radius: 4px; background: var(--cobalt);
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white;
  }

  .stage {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .step-tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mist); margin-bottom: 8px; }
  .stage h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .stage .instruction { font-size: 12.5px; color: rgba(255,255,255,0.6); max-width: 280px; margin-bottom: 24px; }

  .camera-frame {
    position: relative; width: 240px; height: 240px; border-radius: 20px;
    background: radial-gradient(ellipse at center, #2A3142 0%, #171B26 70%);
    display: flex; align-items: center; justify-content: center; margin-bottom: 22px; overflow: hidden;
  }
  .face-oval {
    width: 140px; height: 185px; border-radius: 50%; border: 3px solid var(--cobalt);
    box-shadow: 0 0 0 4px rgba(29, 79, 216, 0.18); position: relative;
  }
  .face-oval::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 3px solid transparent; border-top-color: #7C9BFF; animation: spin 2.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rotate-hint {
    position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center;
    gap: 8px; font-size: 10px; color: rgba(255,255,255,0.5);
  }

  .rec-controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .rec-button {
    width: 56px; height: 56px; border-radius: 50%; background: var(--poppy);
    border: 4px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
  }
  .rec-button .dot { width: 20px; height: 20px; border-radius: 50%; background: white; }
  .rec-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); }

  .progress-dots { display: flex; gap: 7px; margin-top: 22px; }
  .dot-step { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.2); }
  .dot-step.active { background: var(--cobalt); width: 20px; border-radius: 4px; }
  .dot-step.done { background: #34C77B; }

  .privacy-note { margin-top: 26px; font-size: 10.5px; color: rgba(255,255,255,0.4); max-width: 300px; line-height: 1.5; }
  .privacy-note strong { color: rgba(255,255,255,0.6); }
</style>
</head>
<body>

<div class="device">
  <div class="notch"></div>
  <div class="screen">
    <div class="partner-bar">
      <div class="host-context"><span class="host-dot">C</span>Continuing with Clever</div>
      <div class="docusign-badge"><span class="ds-mark">D</span>DocuSign</div>
    </div>

    <div class="stage">
      <div class="step-tag">Step 2 of 3 · Identity Verification</div>
      <h1>Record a quick video</h1>
      <p class="instruction">Position your face in the frame, then slowly turn your head from left to right.</p>

      <div class="camera-frame">
        <div class="face-oval">
          <div class="rotate-hint"><span>← turn</span><span>turn →</span></div>
        </div>
      </div>

      <div class="rec-controls">
        <div class="rec-button"><div class="dot"></div></div>
        <div class="rec-label">Start Recording</div>
      </div>

      <div class="progress-dots">
        <div class="dot-step done"></div>
        <div class="dot-step active"></div>
        <div class="dot-step"></div>
      </div>

      <p class="privacy-note">
        <strong>Used only to verify your identity.</strong> Never shared with the buyer. Processed securely by DocuSign.
      </p>
    </div>
  </div>
</div>

</body>
</html>
