<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funding Complete — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2563EB;
    --green: #10B981;
    --green-dark: #0F9F76;
    --green-light: #D1FAE5;
    --blue-light: #EFF6FF;
    --gray-bg: #F8FAFC;
    --border: #E5E7EB;
    --text: #111827;
    --text-body: #4B5563;
    --text-muted: #9CA3AF;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', sans-serif;
    background: #E7EAEE;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 0;
  }
  h1, .brand { font-family: 'Poppins', sans-serif; }

  .device {
    width: 393px; height: 852px; background: #000; border-radius: 55px; padding: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35); position: relative;
  }
  .screen {
    width: 100%; height: 100%; background: var(--gray-bg); border-radius: 42px;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
  }
  .notch {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #000; border-radius: 20px; z-index: 100;
  }

  header {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: 52px 18px 12px; flex-shrink: 0; position: relative; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--blue); }
  .brand .dot {
    width: 24px; height: 24px; border-radius: 7px; background: var(--blue); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }

  .confetti-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .confetti { position: absolute; top: -20px; width: 8px; height: 12px; opacity: 0.9; animation: fall linear infinite; }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(900px) rotate(540deg); opacity: 0.6; }
  }

  .stage {
    position: relative; z-index: 6; flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 20px; text-align: center;
  }

  .success-badge {
    width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .success-badge { position: relative; }
  .check-circle {
    width: 90px; height: 90px; border-radius: 50%; background: var(--green);
    display: flex; align-items: center; justify-content: center; position: relative; z-index: 2;
    box-shadow: 0 10px 26px rgba(16,185,129,0.35);
  }
  .check-circle svg { width: 46px; height: 46px; }
  .check-circle svg path {
    fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 64; stroke-dashoffset: 64; animation: draw 0.45s 0.35s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .spark {
    position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; border-radius: 2px;
    opacity: 0; z-index: 1; animation: burst 1.05s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(-50%, -50%) rotate(var(--a)) translateY(0) scale(0.4); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(var(--a)) translateY(calc(-1 * var(--r))) scale(1); opacity: 0; }
  }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .eyebrow { font-size: 11px; font-weight: 600; color: var(--green-dark); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .stage h1 { font-size: 23px; font-weight: 700; margin-bottom: 8px; }
  .stage .sub { font-size: 13px; color: var(--text-body); max-width: 300px; margin-bottom: 24px; line-height: 1.55; }
  .stage .sub strong { color: var(--text); }

  .summary-card {
    background: var(--white); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; width: 100%; max-width: 310px; margin-bottom: 22px; text-align: left;
  }
  .summary-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 12.5px; border-bottom: 1px solid #F1F3F5; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { color: var(--text-muted); }
  .summary-row .value { font-weight: 600; text-align: right; }
  .summary-row.total .label { color: var(--text); font-weight: 600; }
  .summary-row.total .value { color: var(--green-dark); font-size: 16px; font-weight: 700; }

  .cta-row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 310px; margin-bottom: 20px; }
  .btn {
    width: 100%; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; padding: 12px;
    border-radius: 10px; border: none; cursor: pointer;
  }
  .btn.primary { background: var(--blue); color: white; }
  .btn.ghost { background: transparent; color: var(--text-body); border: 1px solid var(--border); }

  .review-note { font-size: 12px; color: var(--text-muted); }
  .review-note a { color: var(--blue); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<div class="device">
  <div class="notch"></div>
  <div class="screen">
    <header>
      <div class="brand"><span class="dot">C</span>Clever Offers</div>
    </header>

    <div class="confetti-layer" id="confetti"></div>

    <div class="stage">
      <div class="success-badge" id="successBadge">
        <div class="check-circle"><svg viewBox="0 0 54 54" aria-hidden="true"><path d="M14 28 L23 37 L41 17"></path></svg></div>
      </div>

      <div class="eyebrow">Sale Complete</div>
      <h1>You're all set, Adam!</h1>
      <p class="sub">Funds deposited to your account ending in <strong>•••• 4821</strong>. From listing to funded in just 9 days.</p>

      <div class="summary-card">
        <div class="summary-row"><span class="label">Property</span><span class="value">3734 E Royal Troon Dr</span></div>
        <div class="summary-row"><span class="label">Sold to</span><span class="value">Meridian Home Buyers</span></div>
        <div class="summary-row"><span class="label">Closing date</span><span class="value">Aug 27, 2026</span></div>
        <div class="summary-row total"><span class="label">Total deposited</span><span class="value">$470,000</span></div>
      </div>

      <div class="cta-row">
        <button class="btn primary">View Your Dashboard</button>
        <button class="btn ghost">Download Closing Documents</button>
      </div>

      <div class="review-note">
        ⭐ Mind sharing how it went? <a href="#">Leave a review</a>
      </div>
    </div>
  </div>
</div>

<script>
  const colors = ['#2563EB', '#F59E0B', '#10B981', '#1D4ED8'];
  const layer = document.getElementById('confetti');
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (3 + Math.random() * 2.5) + 's';
    el.style.animationDelay = (Math.random() * 2) + 's';
    el.style.width = (6 + Math.random() * 4) + 'px';
    el.style.height = (9 + Math.random() * 5) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    layer.appendChild(el);
  }

  // Firework burst around the success check
  (function () {
    var badge = document.getElementById('successBadge');
    if (!badge) return;
    var sparkColors = ['#2563EB', '#F59E0B', '#10B981', '#1D4ED8'];
    var N = 12, R = 62;
    for (var s = 0; s < N; s++) {
      var sp = document.createElement('div');
      sp.className = 'spark';
      sp.style.setProperty('--a', (s * (360 / N)) + 'deg');
      sp.style.setProperty('--r', R + 'px');
      sp.style.background = sparkColors[s % sparkColors.length];
      sp.style.animationDelay = (0.35 + (s % 4) * 0.05) + 's';
      badge.appendChild(sp);
    }
  })();
</script>

</body>
</html>
