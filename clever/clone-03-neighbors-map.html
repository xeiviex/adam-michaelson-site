<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clever Offers — Your Neighbors Use Clever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2563EB;
    --blue-dark: #1D4ED8;
    --text: #111827;
    --text-body: #4B5563;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  h1, .logo-text { font-family: 'Poppins', sans-serif; }
  a { text-decoration: none; color: inherit; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
  }
  .header-side { display: flex; align-items: center; gap: 16px; width: 90px; }
  .header-side.right { justify-content: flex-end; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--text); font-size: 16px; cursor: pointer; border: none; background: transparent;
  }
  .icon-btn:hover { background: #F3F4F6; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 50%; background: var(--blue); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0;
  }
  .logo-text { line-height: 1.1; }
  .logo-text .l1 { font-weight: 700; font-size: 16px; color: var(--blue); }
  .logo-text .l2 { font-size: 9px; font-weight: 600; color: var(--blue); letter-spacing: 0.12em; }

  .progress-track { height: 4px; background: #EEF0F3; }
  .progress-fill { height: 100%; width: 12%; background: var(--blue); }

  .stage {
    max-width: 640px; margin: 0 auto; padding: 56px 24px 70px; text-align: center;
  }
  .stage h1 { font-size: 30px; font-weight: 800; margin-bottom: 12px; }
  .stage .sub { font-size: 15px; color: var(--text-body); margin-bottom: 40px; }

  /* ---------- Map circle ---------- */
  .map-wrap { position: relative; width: 340px; height: 340px; margin: 0 auto 20px; }
  .map-circle {
    width: 100%; height: 100%; border-radius: 50%;
    background:
      linear-gradient(120deg, rgba(59,130,246,0.05), rgba(59,130,246,0.02)),
      repeating-linear-gradient(0deg, transparent, transparent 28px, #EDEFF2 28px, #EDEFF2 29px),
      repeating-linear-gradient(90deg, transparent, transparent 28px, #EDEFF2 28px, #EDEFF2 29px),
      #FAFBFC;
    position: relative; overflow: hidden; border: 1px solid var(--border);
  }
  .dot {
    position: absolute; border-radius: 50%; background: var(--blue);
  }
  .callout {
    position: absolute; right: -24px; top: 44%; transform: translateY(-50%);
    background: var(--white); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(15,23,42,0.1); padding: 14px 18px;
    display: flex; align-items: center; gap: 10px; text-align: left; min-width: 170px;
  }
  .callout .dot-marker { width: 12px; height: 12px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  .callout .num { font-size: 19px; font-weight: 700; line-height: 1.1; }
  .callout .lbl { font-size: 11.5px; color: var(--text-muted); }
  .callout .zip { font-weight: 700; color: var(--text); }

  .disclaimer { font-size: 11.5px; color: var(--text-muted); max-width: 460px; margin: 0 auto 40px; line-height: 1.5; }

  .next-btn {
    display: inline-block; width: 100%; max-width: 420px; background: var(--blue); color: white;
    font-weight: 700; font-size: 16px; padding: 15px; border-radius: 10px; border: none; cursor: pointer;
  }
  .next-btn:hover { background: var(--blue-dark); }

  @media (max-width: 500px) {
    .map-wrap { width: 280px; height: 280px; }
    .callout { right: -10px; padding: 10px 14px; min-width: 140px; }
  }
  @media (max-width: 420px) {
    .map-wrap { width: 240px; height: 240px; }
    .callout { right: 0; top: 50%; padding: 8px 12px; min-width: 120px; }
    .callout .num { font-size: 16px; }
    header { padding: 14px 16px; }
    .stage { padding: 40px 16px 50px; }
    .stage h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-side">
    <a href="clone-02-concierge-intro.html"><button class="icon-btn" title="Back">←</button></a>
  </div>
  <a href="clone-01-homepage.html" class="logo">
    <div class="logo-mark">C</div>
    <div class="logo-text">
      <div class="l1">clever</div>
      <div class="l2">OFFERS</div>
    </div>
  </a>
  <div class="header-side right">
    <button class="icon-btn" title="Call us">📞</button>
    <a href="clone-01-homepage.html"><button class="icon-btn" title="Close">✕</button></a>
  </div>
</header>

<div class="progress-track"><div class="progress-fill"></div></div>

<div class="stage">
  <h1>Your neighbors already use Clever Offers</h1>
  <p class="sub">Homeowners near you are choosing Clever to sell their home.</p>

  <div class="map-wrap">
    <div class="map-circle" id="mapCircle"></div>
    <div class="callout">
      <div class="dot-marker"></div>
      <div>
        <div class="num">50+</div>
        <div class="lbl">homeowners near<br><span class="zip">84005</span></div>
      </div>
    </div>
  </div>

  <p class="disclaimer">Based on homeowner inquiries to Clever in this ZIP code. Locations shown are randomized and are for illustration purposes.</p>

  <a href="clone-04-how-it-works.html">
    <button class="next-btn">Next</button>
  </a>
</div>

<script>
  const circle = document.getElementById('mapCircle');
  const count = 55;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const radius = Math.sqrt(Math.random()) * 46; // percent, keeps dots inside circle, denser toward center
    const cx = 50 + radius * Math.cos(angle);
    const cy = 50 + radius * Math.sin(angle);
    const size = 5 + Math.random() * 9;
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = cx + '%';
    dot.style.top = cy + '%';
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
    circle.appendChild(dot);
  }
</script>

</body>
</html>
